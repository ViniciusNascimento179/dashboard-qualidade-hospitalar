on:
  workflow_dispatch:
  push:
permissions:
  contents: write
  workflows: write
  pages: write
  id-token: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap (extrai, organiza, processa e commita)
        run: |
          if [ -f bootstrap-inspecoes.zip ]; then
            unzip -o bootstrap-inspecoes.zip -d _b
            unzip -o _b/dashboard-inspecoes-projeto.zip -d _projeto
            find . -mindepth 1 -maxdepth 1 ! -name '.github' ! -name '_b' ! -name '_projeto' -exec rm -rf {} +
            rsync -a _projeto/ ./
            rm -rf _b _projeto bootstrap-inspecoes.zip
            pip install -r requirements.txt
            python scripts/processa_dados.py
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            rm -f .github/workflows/bootstrap.yml
            git add -A
            git diff --cached --quiet || git commit -m "chore: bootstrap do projeto (estrutura completa)"
            git push
          else
            echo "Nenhum bootstrap-inspecoes.zip na raiz - nada a fazer."
          fi
